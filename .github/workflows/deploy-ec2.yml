name: Deploy DEVON to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: devon-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::263051787000:role/DevonGitHubDeployRole
          aws-region: ap-northeast-2
          allowed-account-ids: "263051787000"
          mask-aws-account-id: true

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: i-0c374fc2186ceacec
        run: |
          cat > ssm-parameters.json <<'JSON'
          {
            "commands": [
              "sudo -iu ubuntu bash -lc 'cd /home/ubuntu/apps/devon && git fetch origin develop && git checkout -B develop origin/develop && ./ops/deploy.sh'"
            ]
          }
          JSON

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"

          status="Pending"
          for attempt in {1..180}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json

          test "$status" = "Success"

      - name: Verify public health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 \
            https://devon-chonnam-3.duckdns.org/api/health
