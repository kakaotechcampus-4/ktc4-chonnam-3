openapi: 3.1.0
info:
  title: DEVON Sprint 1 Contract
  version: 1.0.0-sprint1
  description: >-
    Sprint 1 FE/BE API contract source, aligned with frontend/docs/api-spec.md.
    Only fetch-based endpoints appear here. Browser-navigation endpoints
    (GET /auth/github/login, /auth/github/callback, /auth/github/link,
    /auth/github/link/callback), the SSE stream (GET /analysis-runs/{runId}/events)
    and the WebSocket upgrade (/ws/interviews/{sessionId}) are specified in
    frontend/docs/api-spec.md and are not expressible here.
    Sprint 1 document input, WebSocket identity/messages, abandonment and report
    score policies were resolved by spec/ai/decisions/0010-sprint1-interface-runtime-decisions.md.
    Sprint 1 authentication uses the devon_session HttpOnly cookie and a Redis
    server session per spec/shared/decisions/0003-sprint1-session-auth.md.
    JWT and POST /auth/refresh are deferred to Sprint 2.
    Implementation and detailed scoring criteria still require verification.
servers:
  - url: /api
x-contract-status: sprint1-fix
x-pending: []
security:
  - sessionCookie: []
paths:
  /auth/logout:
    post:
      operationId: logout
      summary: Delete the current Redis login session and expire its cookie
      description: >-
        Idempotent: an absent or expired session also returns 204. The stored
        GitHub OAuth token is retained. Redis failures are server errors,
        not successful logout.
      security: []
      responses:
        '204':
          description: Logged out
  /me:
    get:
      operationId: getMe
      summary: Minimal identity for the global header
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'
  /me/profile:
    get:
      operationId: getMeProfile
      summary: My page profile panel
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
  /me/home:
    get:
      operationId: getHome
      summary: Home dashboard
      responses:
        '200':
          description: Home panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: github_token_invalid — the linked GitHub token is no longer valid; re-link GitHub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /me/interviews:
    get:
      operationId: listInterviews
      summary: My interview history
      description: >-
        Lists completed interviews and abandoned interviews that had started
        (startedAt is not null). Interviews abandoned before the first question are
        not listed. startedAt is set when the first question is saved. Rows are ordered
        by coalesce(completedAt, startedAt) descending, then id descending. total counts
        the listed rows; averageScore averages completed interviews only. See
        spec/shared/decisions/0009-interview-abandon-transition.md.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Interview page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewListResponse'
        '401':
          $ref: '#/components/responses/Error'
  /documents/preview:
    post:
      operationId: previewDocument
      summary: Extract text and GitHub URLs from an uploaded document
      description: >-
        Called in the background as soon as a file is selected. The client must not
        set Content-Type - the browser generates the multipart boundary.
        docType identifies the selected document role and defaults to portfolio
        for existing clients. The default upload limits are 20 MiB for portfolio
        and 10 MiB for cover_letter. PDF, DOCX, TXT and MD have native extraction;
        configured Vision may supplement scanned PDFs and layout, and is required
        for PNG, JPG, JPEG, PPT and PPTX. An unavailable or incomplete extraction
        never establishes that unread content is absent. Unsupported formats
        return 415; extraction status distinguishes succeeded, partial and failed.
      x-max-file-bytes-by-doc-type:
        portfolio: 20971520
        cover_letter: 10485760
      x-native-file-extensions: [pdf, docx, txt, md]
      x-vision-file-extensions: [png, jpg, jpeg, ppt, pptx]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Document bytes; supported format and size depend on docType and configured extraction providers.
                docType:
                  type: string
                  enum: [portfolio, cover_letter]
                  default: portfolio
                  description: Document role, preserved independently of its upload filename.
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /analysis-runs:
    post:
      operationId: createAnalysisRun
      summary: Start an analysis run
      description: >-
        documentId is optional. When omitted, the doc_extract step is reported as
        skipped rather than failed.
        postingUrl is required. If it is omitted, null, or blank, the server
        returns 400 with reason posting_url_required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRunRequest'
      responses:
        '202':
          description: Analysis run accepted
          headers:
            Location:
              description: /analysis-runs/{runId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnalysisRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: github_token_invalid — the linked GitHub token is no longer valid; re-link GitHub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            run_in_progress when a queued or running run already exists for the same
            user, normalized postingUrl, documentId and coverLetterDocumentId
            (error.details.runId holds the existing run ID); document_extract_failed
            when an attached portfolio or cover letter document failed extraction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /analysis-runs/{runId}:
    get:
      operationId: getAnalysisRun
      summary: Analysis run state
      description: >-
        A failed analysis still returns 200. The client branches on status and
        failureReason, not on the status code.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Analysis status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /analysis-runs/{runId}/result:
    get:
      operationId: getAnalysisRunResult
      summary: JD requirements and repository cards
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Analysis result. DB partial runs may still expose this result while FE status is failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResultResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /analysis-runs/{runId}/candidates:
    get:
      operationId: getAnalysisRunCandidates
      summary: Next ranked batch of repository candidates within the same run
      description: >-
        Filter-rejected repositories (private, fork, archived, no_language,
        too_small, inaccessible) are not returned.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Candidate page. Card schema is identical to the result endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'
        '202':
          description: Candidate page analysis is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzingResponse'
        '400':
          description: invalid_request — page must be an integer greater than or equal to 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: not_ready when the run cannot provide candidates; candidate_page_failed when the requested page failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: run_expired — the analysis run is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews:
    post:
      operationId: createInterview
      summary: Create an interview session from a run and selected repositories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewRequest'
      responses:
        '201':
          description: Interview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInterviewResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /interviews/{id}:
    get:
      operationId: getInterview
      summary: Interview state, shared by the prepare and in-progress screens
      description: >-
        Returns 200 for any existing interview regardless of status. The client
        decides which screen to render from status.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: Interview detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewDetailResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /interviews/{id}/turns/{turn}/question-audio:
    get:
      operationId: getInterviewQuestionAudio
      summary: Play the saved question using its persona voice
      description: >-
        Authenticated access to a question owned by the current user. The WebSocket
        question includes this same-origin URL when TTS is enabled. The server
        reuses cached audio or synthesizes the saved question within the explicitly
        initialized free character allowance. Missing configuration, budget,
        synthesis or cache failures return not_ready; the client keeps the question
        text visible. Audio failure never submits an answer or advances the turn.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
        - name: turn
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: MP3 question audio. Cache-Control is private, no-store.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: not_found when the interview or question is absent or belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: not_ready. Keep displaying the question text and allow text fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews/{id}/question/retry:
    post:
      operationId: retryInterviewQuestion
      summary: Resume the same interview without resubmitting saved answers
      description: >-
        Explicitly regenerates the missing next question after saved answer analysis
        succeeded and Director generation failed. The server preserves prior turns,
        analyses, evidence, selected code versions and failed call records. Permanent
        authentication or quota failures are not eligible. On refresh GET returns
        questionRetryState so the same requestId can be restored. A replay may rotate
        realtime session only for the current unanswered target turn. One manual
        round is allowed per target question; each round has one Plan and one independent
        Review. A safe rewrite rejection also permits one automatic round. Including
        initial generation, the target question has at most six provider attempts.
        Reusing requestId replays its result without another model call. A successful
        response issues a new realtime sessionId; reconnect to receive the saved next
        question. STT, answer analysis and repository analysis are not rerun.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRetryRequest'
      responses:
        '200':
          description: The reviewed next question is saved in the same interview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRetryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            question_retry_in_progress while the claimed round is running;
            question_retry_unavailable outside a recoverable next-question state;
            question_retry_failed after a completed round is rejected;
            question_retry_limit after the manual allowance is consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews/{id}/prepare/retry:
    post:
      operationId: retryInterviewPrepare
      summary: Re-run interview preparation from the step that failed
      description: >-
        Only for interviews in preparing_failed. The server resumes from the failed
        prepareStepKey and does not re-run completed steps. The session and its
        session_repositories are kept. Progress is delivered over the WebSocket as
        prepareStep events, not in this response.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '204':
          description: Re-run accepted
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            prep_in_progress when a re-run is already running, prep_failed when the
            interview is not in preparing_failed, session_limit_exceeded when another
            active interview exists for the same run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: session_expired when the session no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews/{id}/abandon:
    post:
      operationId: abandonInterview
      summary: Abandon an interview on explicit exit or repository reselection
      description: >-
        Allowed for interviews in in_progress or preparing_failed. Calling it again on
        an abandoned interview returns 204. After abandonment the interview does not
        change status, results of work that overlapped the call are not stored, and the
        server closes any open WebSocket for the interview without a dedicated close
        code. See spec/shared/decisions/0009-interview-abandon-transition.md.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '204':
          description: Interview is abandoned
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: not_found when the interview does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            already_completed when the interview is completed or in another state that
            cannot be abandoned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews/{id}/report:
    get:
      operationId: getInterviewReport
      summary: Interview report
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '202':
          description: Report is generating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratingResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: not_found when the interview does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/Error'
  /interviews/{id}/retry:
    post:
      operationId: retryInterview
      summary: Create a new session copying the original run and repositories
      description: >-
        Allowed when the original interview is completed, or abandoned after it had
        started (startedAt is not null). See
        spec/shared/decisions/0009-interview-abandon-transition.md.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '201':
          description: New interview from original inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInterviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: not_found when the original interview does not exist or belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: >-
            original_not_completed when the original is neither completed nor abandoned
            after starting, repository_unavailable, or session_limit_exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          $ref: '#/components/responses/Error'
  /interviews/{id}/feedback-disagreements:
    post:
      operationId: submitFeedbackDisagreement
      summary: Disagree with one persona's feedback
      description: >-
        The path parameter is interviewId. A report is unique per interview, so no
        separate reportId is issued. Submission records a concern only and never
        changes scores automatically. expectedRevision must match the displayed
        report; omission is accepted only for the original revision 1. The unique
        submission unit is (interviewId, revision, persona); a new published
        revision does not inherit a previous revision's submitted flag.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackDisagreementRequest'
      responses:
        '204':
          description: Submitted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            already_submitted for the same report revision and persona;
            report_unavailable when the interview is not completed, no report
            exists, or expectedRevision does not match the current revision.
            This reason alone does not distinguish absence from a stale revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /interviews/{id}/report/retry:
    post:
      operationId: retryReportGeneration
      summary: Explicitly retry a failed report without a successful result
      description: >-
        Only the owner of a completed interview with an answered turn may retry.
        Requires a recorded generation failure and no successful report. Duplicate
        requests for the same active retry return 202 without another job. This
        endpoint never replaces a successful report or starts a new interview.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '202':
          description: Explicit retry queued or already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratingResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: report_unavailable when no eligible failure or a successful report exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: devon_session
      description: >-
        Opaque login session ID backed by Redis, distinct from the interview
        sessionId. Uses a 14-day sliding lifetime. Missing or invalid sessions
        return 401 unauthenticated; no JWT refresh is used in Sprint 1.
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    InterviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [reason, message]
          properties:
            reason:
              type: string
              description: Stable snake_case string the client branches on.
            message:
              type: string
            retryAfter:
              type: integer
              description: Optional. Distinct from the top-level retryAfter of 202 bodies.
            details:
              type: object
              additionalProperties: true

    AnalysisStatus:
      type: string
      enum: [syncing, no_repository, no_interview, completed]
    RunStatus:
      type: string
      enum: [running, completed, failed]
    InterviewStatus:
      type: string
      enum: [preparing, preparing_failed, in_progress, completed, abandoned]
    StepKey:
      type: string
      enum: [doc_extract, repo_select, repo_detail, jd_fetch, jd_extract, repo_analyze, match_score]
    PrepareStepKey:
      type: string
      enum: [analyze_repo, build_persona, compose_question, set_criteria]
    StepStatus:
      type: string
      enum: [pending, running, completed, failed, skipped]
      description: >-
        skipped means the step was not run because its input was absent - a normal
        path, distinct from failed. It applies to StepKey only.
    AnswerMode:
      type: string
      enum: [text, voice]
      description: >-
        New interviews are voice. text remains only for interviews created before
        the voice switch (spec/shared/decisions/0007, Proposed).
    DocumentExtractStatus:
      type: string
      enum: [succeeded, partial, failed]
    RepoStatus:
      type: string
      enum: [succeeded, partial, failed]
    CandidateSource:
      type: string
      enum: [rule_filter, portfolio, both]
    JdCategory:
      type: string
      description: API·DB·AI가 같은 값으로 사용하는 JD 분류. responsibility는 Wanted main_tasks에서 나온 주요 업무이며 수집 단계의 source_field로 원문 출처를 보존한다.
      enum: [required, preferred, responsibility]
    Persona:
      type: string
      enum: [tech_lead, hr_manager, domain_lead]
    ScoreKey:
      type: string
      enum:
        - project_understanding
        - technical_reasoning
        - problem_solving
        - communication
        - contribution_clarity
        - company_job_fit
    ReasonType:
      type: string
      enum: [factual_error, insufficient_basis, overly_harsh, unclear_intent, other]

    LanguageRatio:
      type: object
      required: [name, ratio]
      properties:
        name:
          type: string
        ratio:
          type: number

    MeResponse:
      type: object
      required: [name, avatarUrl, githubLinked]
      properties:
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        githubLinked:
          type: boolean

    MeProfileResponse:
      type: object
      required: [name, avatarUrl, loginId, joinedAt, desiredPosition, github, interviewSummary]
      properties:
        name:
          type: string
        avatarUrl:
          type: string
        loginId:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
        desiredPosition:
          type: string
          nullable: true
          description: >-
            Position of the most recently completed interview, null when there is
            none.
        github:
          type: object
          required: [linked, login, publicRepoCount]
          properties:
            linked:
              type: boolean
            login:
              type: string
              nullable: true
            publicRepoCount:
              type: integer
              nullable: true
        interviewSummary:
          type: object
          required: [totalCount, averageScore]
          properties:
            totalCount:
              type: integer
            averageScore:
              type: number
              nullable: true

    AnalysisPanel:
      type: object
      required: [basedOnRepoCount, languages, projectTypes, roleSummary]
      properties:
        basedOnRepoCount:
          type: integer
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRatio'
        projectTypes:
          type: array
          items:
            type: string
        roleSummary:
          type: string

    RecentInterview:
      type: object
      required: [id, position, companyName, totalScore, completedAt]
      properties:
        id:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        totalScore:
          type: number
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    HomeResponse:
      type: object
      required: [name, githubLinked, repositoryCount, analysisStatus, analysis, recentInterviews]
      properties:
        name:
          type: string
        githubLinked:
          type: boolean
        repositoryCount:
          type: integer
        analysisStatus:
          $ref: '#/components/schemas/AnalysisStatus'
        analysis:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnalysisPanel'
        recentInterviews:
          type: array
          items:
            $ref: '#/components/schemas/RecentInterview'

    InterviewSummary:
      type: object
      required:
        - id
        - position
        - companyName
        - techStack
        - careerLevel
        - repositoryNames
        - status
        - totalScore
        - startedAt
        - completedAt
      properties:
        id:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        techStack:
          type: array
          items:
            type: string
        careerLevel:
          type: string
        repositoryNames:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/InterviewStatus'
        totalScore:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    InterviewListResponse:
      type: object
      required: [interviews, total, page, size, averageScore]
      properties:
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewSummary'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        averageScore:
          type: number
          nullable: true

    DocumentPreviewResponse:
      type: object
      required: [documentId, extractStatus]
      properties:
        documentId:
          type: string
        extractStatus:
          $ref: '#/components/schemas/DocumentExtractStatus'

    CreateAnalysisRunRequest:
      type: object
      required: [postingUrl]
      properties:
        postingUrl:
          type: string
          description: Sprint 1 accepts Wanted URLs only.
        documentId:
          type: string
          nullable: true
          description: Owned portfolio ID from POST /documents/preview; used as a repository recommendation hint and interview source. Omit to skip portfolio doc_extract.
        coverLetterDocumentId:
          type: string
          nullable: true
          format: uuid
          description: Owned cover_letter ID from POST /documents/preview. Optional and independent of documentId; used for interview claims, never substituted for the portfolio recommendation hint. A changed selection creates a distinct analysis input.

    CreateAnalysisRunResponse:
      type: object
      required: [runId]
      properties:
        runId:
          type: string

    AnalysisStep:
      type: object
      required: [key, status]
      properties:
        key:
          $ref: '#/components/schemas/StepKey'
        status:
          $ref: '#/components/schemas/StepStatus'

    AnalysisRunResponse:
      type: object
      required: [runId, status, steps, progress, failureReason, estimatedSeconds]
      properties:
        runId:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        steps:
          type: array
          description: >-
            Always contains all seven StepKey values. A step that did not run is
            reported as skipped rather than omitted, and is excluded from progress.
          items:
            $ref: '#/components/schemas/AnalysisStep'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        failureReason:
          type: string
          nullable: true
          description: >-
            Internal analysis_jobs.error_code, such as token_invalid or
            llm_parse_failed. This is not the HTTP error.reason namespace;
            github_token_invalid remains the HTTP authentication error reason.
            Known values (backend ANALYSIS_JOB_ERROR_CODES): internal_error,
            run_expired, repo_unreachable, no_readme, input_too_large,
            not_a_job_posting, no_public_repo, rate_limited, token_invalid,
            jd_fetch_failed, jd_extraction_failed, unsupported_site,
            doc_extract_failed, llm_timeout, llm_parse_failed, llm_failed.
            Repository error codes reported by a partial run
            (REPO_ANALYSIS_ERROR_CODES) are a subset of this list. The list is not
            enforced at runtime, so clients must treat unknown values as a generic
            retry case.
            No remaining wait time is exposed for rate_limited.
        estimatedSeconds:
          type: integer
          nullable: true

    JdRequirement:
      type: object
      required: [id, category, text, displayOrder]
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/JdCategory'
        text:
          type: string
        displayOrder:
          type: integer

    RepositoryCard:
      type: object
      required:
        - id
        - name
        - fullName
        - description
        - languages
        - topics
        - stars
        - forks
        - commitCount
        - userCommitCount
        - pushedAt
        - status
        - errorCode
        - recommended
        - candidateSource
        - recommendReason
        - matchScore
        - matchedRequirementIds
      properties:
        id:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
          nullable: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRatio'
        topics:
          type: array
          items:
            type: string
        stars:
          type: integer
        forks:
          type: integer
        commitCount:
          type: integer
          nullable: true
        userCommitCount:
          type: integer
          nullable: true
        pushedAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/RepoStatus'
        errorCode:
          type: string
          nullable: true
        recommended:
          type: boolean
        candidateSource:
          $ref: '#/components/schemas/CandidateSource'
        recommendReason:
          type: string
          nullable: true
        matchScore:
          type: number
          nullable: true
        matchedRequirementIds:
          type: array
          items:
            type: string

    FailedRepository:
      type: object
      additionalProperties: false
      required: [repositoryId, errorCode]
      properties:
        repositoryId:
          type: string
        errorCode:
          type: string
          description: Internal repository analysis error code, such as llm_parse_failed.

    AnalysisRunResultResponse:
      type: object
      required:
        - runId
        - position
        - companyName
        - jdRequirements
        - mentionedRepoCount
        - matchedRepoCount
        - analyzedCount
        - failedCount
        - failedRepositories
        - repositories
      properties:
        runId:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        jdRequirements:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JdRequirement'
        mentionedRepoCount:
          type: integer
        matchedRepoCount:
          type: integer
        analyzedCount:
          type: integer
          minimum: 0
          description: >-
            Count of succeeded or partial L1 snapshots bound to this run's
            assigned batches. Includes repositories filtered from cards after
            assignment. A partial repository is not selectable for interview.
        failedCount:
          type: integer
          minimum: 0
          description: >-
            Count of failed L1 snapshots bound to this run's assigned batches,
            including repositories filtered from cards after assignment.
            Equals the number of failedRepositories entries.
        failedRepositories:
          type: array
          description: >-
            Failures among repositories eligible at batch assignment, including
            those later filtered from cards. Exposes only repository identifiers
            and error codes, without repository metadata or credentials.
          items:
            $ref: '#/components/schemas/FailedRepository'
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCard'

    CandidatesResponse:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCard'

    AnalyzingResponse:
      type: object
      required: [status, retryAfter]
      properties:
        status:
          type: string
          enum: [analyzing]
        retryAfter:
          type: integer
          description: >-
            Seconds to wait before polling again. Top-level field. Distinct from
            error.retryAfter.

    CreateInterviewRequest:
      type: object
      required: [runId, repositoryIds]
      properties:
        runId:
          type: string
        repositoryIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string

    CreateInterviewResponse:
      type: object
      required: [sessionId, interviewId]
      properties:
        sessionId:
          type: string
        interviewId:
          type: string

    QuestionRetryRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          description: Reuse this value when the preceding HTTP result is unknown.

    QuestionRetryState:
      type: object
      required: [requestId, turnNo, status, expiresAt]
      properties:
        requestId:
          type: string
          format: uuid
        turnNo:
          type: integer
          minimum: 1
          maximum: 9
        status:
          type: string
          enum: [running, succeeded, failed]
        expiresAt:
          type: string
          format: date-time

    QuestionRetryResponse:
      type: object
      required: [interviewId, sessionId, turnNo]
      properties:
        interviewId:
          type: string
          format: uuid
        sessionId:
          type: string
          description: Newly issued realtime session for the preserved interview.
        turnNo:
          type: integer
          minimum: 2
          maximum: 9

    InterviewTurn:
      type: object
      required: [turn, persona, question, answer, mainIndex, followUpDepth]
      properties:
        turn:
          type: integer
        persona:
          $ref: '#/components/schemas/Persona'
        question:
          type: string
        answer:
          type: string
          nullable: true
        mainIndex:
          type: integer
          minimum: 1
          description: Main question index calculated from the stored parent chain.
        followUpDepth:
          type: integer
          minimum: 0
          description: Follow-up depth calculated from the stored parent chain.
    InterviewLastError:
      type: object
      required: [reason, code, step, recoverable, occurredAt]
      description: >-
        Present only when status is preparing_failed. Field layout matches the WS
        error event so the prepare-failed banner can render from REST alone.
      properties:
        reason:
          type: string
        code:
          type: string
        step:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PrepareStepKey'
        recoverable:
          type: boolean
        occurredAt:
          type: string
          format: date-time

    InterviewDetailResponse:
      type: object
      required:
        - id
        - sessionId
        - runId
        - status
        - answerMode
        - position
        - companyName
        - repositoryNames
        - currentTurn
        - totalTurns
        - remainingSeconds
        - turns
        - lastError
      properties:
        id:
          type: string
        sessionId:
          type: string
        runId:
          type: string
          description: >-
            The analysis_jobs row that produced this interview. Lets the client
            return to the repository-selection screen after a reload.
        status:
          $ref: '#/components/schemas/InterviewStatus'
        answerMode:
          $ref: '#/components/schemas/AnswerMode'
        position:
          type: string
        companyName:
          type: string
          nullable: true
        repositoryNames:
          type: array
          items:
            type: string
        currentTurn:
          type: integer
        totalTurns:
          type: integer
        remainingSeconds:
          type: integer
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
        lastError:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InterviewLastError'
        canRetryQuestion:
          type: boolean
          default: false
          description: Saved answer analysis succeeded but a missing next question can be explicitly regenerated.
        questionRetryCount:
          type: integer
          minimum: 0
          maximum: 1
          default: 0
          description: Manual recovery rounds claimed for the current missing target question.
        questionRetryState:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuestionRetryState'
          description: >-
            Optional persisted manual request state. Restore requestId on refresh and
            poll GET while running. Expiry or unknown transport results never authorize
            a new requestId or model round. Null when no relevant manual request exists.

    ScoreItem:
      type: object
      required: [key, label, score]
      properties:
        key:
          $ref: '#/components/schemas/ScoreKey'
        label:
          type: string
        score:
          type: number
          description: Sprint 1 score from 0 to 100. Detailed criteria require authoring and review.

    AgentFeedback:
      type: object
      required: [persona, tags, strengths, improvements, disagreementSubmitted]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        tags:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        disagreementSubmitted:
          type: boolean

    ReportCoverage:
      type: object
      required: [totalRequirements, coveredRequirements, uncoveredRequirements]
      properties:
        totalRequirements:
          type: integer
        coveredRequirements:
          type: integer
        uncoveredRequirements:
          type: array
          items:
            type: string

    ReportResponse:
      type: object
      required:
        - interviewId
        - revision
        - position
        - positionLabel
        - totalScore
        - headline
        - summary
        - scores
        - agentFeedbacks
        - coverage
        - turns
        - repositoryNames
        - completedAt
      properties:
        interviewId:
          type: string
        revision:
          type: integer
          minimum: 1
          description: Current published report revision; earlier results remain archived.
        position:
          type: string
        positionLabel:
          type: string
        totalScore:
          type: number
          description: Arithmetic mean of the six Sprint 1 scores, from 0 to 100.
        headline:
          type: string
        summary:
          type: string
        scores:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/ScoreItem'
        agentFeedbacks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentFeedback'
        coverage:
          $ref: '#/components/schemas/ReportCoverage'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
        repositoryNames:
          type: array
          items:
            type: string
        completedAt:
          type: string
          format: date-time

    GeneratingResponse:
      type: object
      required: [status, retryAfter]
      properties:
        status:
          type: string
          enum: [generating]
        retryAfter:
          type: integer
          description: Seconds to wait before polling the report again. Always present.

    FeedbackDisagreementRequest:
      type: object
      required: [persona, reasonType]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        reasonType:
          $ref: '#/components/schemas/ReasonType'
        comment:
          type: string
          maxLength: 500
        expectedRevision:
          type: integer
          minimum: 1
          description: Displayed report revision; required after revision 1 to prevent stale submissions.
