openapi: 3.1.0
info:
  title: DEVON Sprint 1 Contract
  version: 1.0.0-sprint1
  description: >-
    Sprint 1 FE/BE API contract source, aligned with frontend/docs/api-spec.md.
    Fetch-based endpoints and the implemented GitHub login/callback redirects
    are specified here. The SSE stream (GET /analysis-runs/{runId}/events) and
    WebSocket upgrade (/ws/interviews/{sessionId}) have detailed wire contracts
    in frontend/docs/api-spec.md. GitHub link endpoints remain follow-up work.
    PENDING_FE items are explicit and must not be guessed by implementers.
servers:
  - url: /api
x-contract-status: sprint1-fix
x-pending:
  - documentId is singular while the job-input screen has two uploaders (PENDING_TEAM)
paths:
  /auth/github/login:
    get:
      operationId: startGitHubLogin
      summary: Start GitHub OAuth login
      responses:
        '302':
          description: Redirect to GitHub after storing a browser-bound, single-use OAuth state
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: HttpOnly oauthState cookie scoped to /api/auth/github
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth login
      description: Redirects to /home on success or /login?error=<safe_reason> on failure. Codes and tokens never appear in the final URL.
      security:
        - OAuthStateCookie: []
        - {}
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: GitHub denial is mapped to the safe frontend reason denied.
          schema:
            type: string
      responses:
        '302':
          description: Browser redirect after success or any safely mapped OAuth failure
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              description: On success, sets DEVON cookies and clears oauthState; on failure, clears oauthState.
              schema:
                type: string
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Atomically rotate the DEVON refresh session
      description: PostgreSQL is the sole refresh authority. Rotation updates the current identifier and sliding 14-day expiry in one transaction. Same-generation replay commits user-wide refresh revocation before returning 401. Missing, expired, or stale-generation sessions are rejected without invalidating newer logins. Redis is not used by this endpoint.
      security:
        - RefreshTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/FrontendOrigin'
      responses:
        '204':
          description: Tokens rotated; response has no body
        '401':
          description: Missing, expired, invalid, or replayed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session and clear auth cookies
      description: Deletes only the matching PostgreSQL session, including after its identifier rotated. A missing or invalid refresh cookie only clears cookies idempotently. Database failure for a valid token is service_unavailable without clearing cookies, never a successful revocation. Redis is not used. Issued access JWTs remain valid for up to 15 minutes.
      security:
        - RefreshTokenCookie: []
        - {}
      parameters:
        - $ref: '#/components/parameters/FrontendOrigin'
      responses:
        '204':
          description: Current session revoked when present; auth cookies cleared; response has no body
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated DEVON identity
      security:
        - AccessTokenCookie: []
      responses:
        '200':
          description: Current user identity and usable GitHub-link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /me/profile:
    get:
      operationId: getMeProfile
      summary: My page profile panel
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfileResponse'
        '401':
          $ref: '#/components/responses/Error'
  /me/home:
    get:
      operationId: getHome
      summary: Home dashboard
      responses:
        '200':
          description: Home panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          $ref: '#/components/responses/Error'
  /me/interviews:
    get:
      operationId: listInterviews
      summary: My interview history
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Interview page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewListResponse'
        '401':
          $ref: '#/components/responses/Error'
  /documents/preview:
    post:
      operationId: previewDocument
      summary: Extract text and GitHub URLs from an uploaded document
      description: >-
        Called in the background as soon as a file is selected. The client must not
        set Content-Type - the browser generates the multipart boundary.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .pdf (text layer only), .docx, .txt or .md. Max 10MB.
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /analysis-runs:
    post:
      operationId: createAnalysisRun
      summary: Start an analysis run
      description: >-
        documentId is optional. When omitted, the doc_extract step is reported as
        skipped rather than failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRunRequest'
      responses:
        '202':
          description: Analysis run accepted
          headers:
            Location:
              description: /analysis-runs/{runId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnalysisRunResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /analysis-runs/{runId}:
    get:
      operationId: getAnalysisRun
      summary: Analysis run state
      description: >-
        A failed analysis still returns 200. The client branches on status and
        failureReason, not on the status code.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Analysis status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /analysis-runs/{runId}/result:
    get:
      operationId: getAnalysisRunResult
      summary: JD requirements and repository cards
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Analysis result. DB partial runs may still expose this result while FE status is failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResultResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /analysis-runs/{runId}/candidates:
    get:
      operationId: getAnalysisRunCandidates
      summary: Next ranked batch of repository candidates within the same run
      description: >-
        Filter-rejected repositories (private, fork, archived, no_language,
        too_small, inaccessible) are not returned.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Candidate page. Card schema is identical to the result endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'
        '202':
          description: Candidate page analysis is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzingResponse'
        '401':
          $ref: '#/components/responses/Error'
  /interviews:
    post:
      operationId: createInterview
      summary: Create an interview session from a run and selected repositories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewRequest'
      responses:
        '201':
          description: Interview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInterviewResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /interviews/{id}:
    get:
      operationId: getInterview
      summary: Interview state, shared by the prepare and in-progress screens
      description: >-
        Returns 200 for any existing interview regardless of status. The client
        decides which screen to render from status.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: Interview detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewDetailResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /interviews/{id}/report:
    get:
      operationId: getInterviewReport
      summary: Interview report
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '202':
          description: Report is generating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratingResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /interviews/{id}/retry:
    post:
      operationId: retryInterview
      summary: Create a new session copying the original run and repositories
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      responses:
        '201':
          description: New interview from original inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInterviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /interviews/{id}/feedback-disagreements:
    post:
      operationId: submitFeedbackDisagreement
      summary: Disagree with one persona's feedback
      description: >-
        The path parameter is interviewId. A report is unique per interview, so no
        separate reportId is issued.
      parameters:
        - $ref: '#/components/parameters/InterviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackDisagreementRequest'
      responses:
        '204':
          description: Submitted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly SameSite=Lax DEVON access JWT; Path=/; 15-minute lifetime.
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly SameSite=Lax DEVON refresh JWT; Path=/api/auth; 14-day rotating lifetime.
    OAuthStateCookie:
      type: apiKey
      in: cookie
      name: oauthState
      description: HttpOnly SameSite=Lax browser binding; Path=/api/auth/github; 10-minute lifetime.
  parameters:
    FrontendOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly equal the configured FRONTEND_ORIGIN.
      schema:
        type: string
        format: uri
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    InterviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      $ref: './api-error.schema.json'

    AnalysisStatus:
      type: string
      enum: [syncing, no_repository, no_interview, completed]
    RunStatus:
      type: string
      enum: [running, completed, failed]
    InterviewStatus:
      type: string
      enum: [preparing, preparing_failed, in_progress, completed, abandoned]
    StepKey:
      type: string
      enum: [doc_extract, repo_select, repo_detail, jd_fetch, jd_extract, repo_analyze, match_score]
    PrepareStepKey:
      type: string
      enum: [analyze_repo, build_persona, compose_question, set_criteria]
    StepStatus:
      type: string
      enum: [pending, running, completed, failed, skipped]
      description: >-
        skipped means the step was not run because its input was absent - a normal
        path, distinct from failed. It applies to StepKey only.
    AnswerMode:
      type: string
      enum: [text]
    DocumentExtractStatus:
      type: string
      enum: [succeeded, partial, failed]
    RepoStatus:
      type: string
      enum: [succeeded, partial, failed]
    CandidateSource:
      type: string
      enum: [rule_filter, portfolio, both]
    JdCategory:
      type: string
      description: API 표시 분류. responsibility는 Wanted main_tasks에서 나온 주요 업무이며 DB requirement_type의 unknown과 원문 출처를 함께 사용해 구분한다.
      enum: [required, preferred, responsibility]
    Persona:
      type: string
      enum: [tech_lead, hr_manager, domain_lead]
    ScoreKey:
      type: string
      enum:
        - project_understanding
        - technical_reasoning
        - problem_solving
        - communication
        - contribution_clarity
        - company_job_fit
    ReasonType:
      type: string
      enum: [factual_error, insufficient_basis, overly_harsh, unclear_intent, other]

    LanguageRatio:
      type: object
      required: [name, ratio]
      properties:
        name:
          type: string
        ratio:
          type: number

    MeResponse:
      $ref: './me-response.schema.json'

    MeProfileResponse:
      type: object
      required: [name, avatarUrl, loginId, joinedAt, desiredPosition, github, interviewSummary]
      properties:
        name:
          type: string
        avatarUrl:
          type: string
        loginId:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
        desiredPosition:
          type: string
          nullable: true
          description: >-
            Position of the most recently completed interview, null when there is
            none.
        github:
          type: object
          required: [linked, login, publicRepoCount]
          properties:
            linked:
              type: boolean
            login:
              type: string
              nullable: true
            publicRepoCount:
              type: integer
              nullable: true
        interviewSummary:
          type: object
          required: [totalCount, averageScore]
          properties:
            totalCount:
              type: integer
            averageScore:
              type: number
              nullable: true

    AnalysisPanel:
      type: object
      required: [basedOnRepoCount, languages, projectTypes, roleSummary]
      properties:
        basedOnRepoCount:
          type: integer
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRatio'
        projectTypes:
          type: array
          items:
            type: string
        roleSummary:
          type: string

    RecentInterview:
      type: object
      required: [id, position, companyName, totalScore, completedAt]
      properties:
        id:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        totalScore:
          type: number
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    HomeResponse:
      type: object
      required: [name, githubLinked, repositoryCount, analysisStatus, analysis, recentInterviews]
      properties:
        name:
          type: string
        githubLinked:
          type: boolean
        repositoryCount:
          type: integer
        analysisStatus:
          $ref: '#/components/schemas/AnalysisStatus'
        analysis:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnalysisPanel'
        recentInterviews:
          type: array
          items:
            $ref: '#/components/schemas/RecentInterview'

    InterviewSummary:
      type: object
      required:
        - id
        - position
        - companyName
        - techStack
        - careerLevel
        - repositoryNames
        - status
        - totalScore
        - startedAt
        - completedAt
      properties:
        id:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        techStack:
          type: array
          items:
            type: string
        careerLevel:
          type: string
        repositoryNames:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/InterviewStatus'
        totalScore:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    InterviewListResponse:
      type: object
      required: [interviews, total, page, size, averageScore]
      properties:
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewSummary'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        averageScore:
          type: number
          nullable: true

    DocumentPreviewResponse:
      type: object
      required: [documentId, extractStatus]
      properties:
        documentId:
          type: string
        extractStatus:
          $ref: '#/components/schemas/DocumentExtractStatus'

    CreateAnalysisRunRequest:
      type: object
      required: [postingUrl]
      properties:
        postingUrl:
          type: string
          description: Sprint 1 accepts Wanted URLs only.
        documentId:
          type: string
          description: Must come from POST /documents/preview. Omit to skip doc_extract.

    CreateAnalysisRunResponse:
      type: object
      required: [runId]
      properties:
        runId:
          type: string

    AnalysisStep:
      type: object
      required: [key, status]
      properties:
        key:
          $ref: '#/components/schemas/StepKey'
        status:
          $ref: '#/components/schemas/StepStatus'

    AnalysisRunResponse:
      type: object
      required: [runId, status, steps, progress, failureReason, estimatedSeconds]
      properties:
        runId:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        steps:
          type: array
          description: >-
            Always contains all seven StepKey values. A step that did not run is
            reported as skipped rather than omitted, and is excluded from progress.
          items:
            $ref: '#/components/schemas/AnalysisStep'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        failureReason:
          type: string
          nullable: true
        estimatedSeconds:
          type: integer
          nullable: true

    JdRequirement:
      type: object
      required: [id, category, text, displayOrder]
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/JdCategory'
        text:
          type: string
        displayOrder:
          type: integer

    RepositoryCard:
      type: object
      required:
        - id
        - name
        - fullName
        - description
        - languages
        - topics
        - stars
        - forks
        - commitCount
        - userCommitCount
        - pushedAt
        - status
        - errorCode
        - recommended
        - candidateSource
        - recommendReason
        - matchScore
        - matchedRequirementIds
      properties:
        id:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
          nullable: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageRatio'
        topics:
          type: array
          items:
            type: string
        stars:
          type: integer
        forks:
          type: integer
        commitCount:
          type: integer
          nullable: true
        userCommitCount:
          type: integer
          nullable: true
        pushedAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/RepoStatus'
        errorCode:
          type: string
          nullable: true
        recommended:
          type: boolean
        candidateSource:
          $ref: '#/components/schemas/CandidateSource'
        recommendReason:
          type: string
          nullable: true
        matchScore:
          type: number
          nullable: true
        matchedRequirementIds:
          type: array
          items:
            type: string

    AnalysisRunResultResponse:
      type: object
      required:
        - runId
        - position
        - companyName
        - jdRequirements
        - mentionedRepoCount
        - matchedRepoCount
        - repositories
      properties:
        runId:
          type: string
        position:
          type: string
        companyName:
          type: string
          nullable: true
        jdRequirements:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JdRequirement'
        mentionedRepoCount:
          type: integer
        matchedRepoCount:
          type: integer
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCard'

    CandidatesResponse:
      type: object
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCard'

    AnalyzingResponse:
      type: object
      required: [status, retryAfter]
      properties:
        status:
          type: string
          enum: [analyzing]
        retryAfter:
          type: integer
          description: Top-level field. Distinct from error.retryAfter.

    CreateInterviewRequest:
      type: object
      required: [runId, repositoryIds]
      properties:
        runId:
          type: string
        repositoryIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string

    CreateInterviewResponse:
      type: object
      required: [sessionId, interviewId]
      properties:
        sessionId:
          type: string
        interviewId:
          type: string

    InterviewTurn:
      type: object
      required: [turn, persona, question, answer]
      properties:
        turn:
          type: integer
        persona:
          $ref: '#/components/schemas/Persona'
        question:
          type: string
        answer:
          type: string
          nullable: true

    InterviewLastError:
      type: object
      required: [reason, code, step, recoverable, occurredAt]
      description: >-
        Present only when status is preparing_failed. Field layout matches the WS
        error event so the prepare-failed banner can render from REST alone.
      properties:
        reason:
          type: string
        code:
          type: string
        step:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PrepareStepKey'
        recoverable:
          type: boolean
        occurredAt:
          type: string
          format: date-time

    InterviewDetailResponse:
      type: object
      required:
        - id
        - sessionId
        - runId
        - status
        - answerMode
        - position
        - companyName
        - repositoryNames
        - currentTurn
        - totalTurns
        - remainingSeconds
        - turns
        - lastError
      properties:
        id:
          type: string
        sessionId:
          type: string
        runId:
          type: string
          description: >-
            The analysis_jobs row that produced this interview. Lets the client
            return to the repository-selection screen after a reload.
        status:
          $ref: '#/components/schemas/InterviewStatus'
        answerMode:
          $ref: '#/components/schemas/AnswerMode'
        position:
          type: string
        companyName:
          type: string
          nullable: true
        repositoryNames:
          type: array
          items:
            type: string
        currentTurn:
          type: integer
        totalTurns:
          type: integer
        remainingSeconds:
          type: integer
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
        lastError:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InterviewLastError'

    ScoreItem:
      type: object
      required: [key, label, score]
      properties:
        key:
          $ref: '#/components/schemas/ScoreKey'
        label:
          type: string
        score:
          type: number
          description: Score formula is PENDING_TEAM.

    AgentFeedback:
      type: object
      required: [persona, tags, strengths, improvements, disagreementSubmitted]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        tags:
          type: array
          items:
            type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        disagreementSubmitted:
          type: boolean

    ReportCoverage:
      type: object
      required: [totalRequirements, coveredRequirements, uncoveredRequirements]
      properties:
        totalRequirements:
          type: integer
        coveredRequirements:
          type: integer
        uncoveredRequirements:
          type: array
          items:
            type: string

    ReportResponse:
      type: object
      required:
        - interviewId
        - position
        - positionLabel
        - totalScore
        - headline
        - summary
        - scores
        - agentFeedbacks
        - coverage
        - turns
        - repositoryNames
        - completedAt
      properties:
        interviewId:
          type: string
        position:
          type: string
        positionLabel:
          type: string
        totalScore:
          type: number
          description: Score formula is PENDING_TEAM.
        headline:
          type: string
        summary:
          type: string
        scores:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/ScoreItem'
        agentFeedbacks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AgentFeedback'
        coverage:
          $ref: '#/components/schemas/ReportCoverage'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
        repositoryNames:
          type: array
          items:
            type: string
        completedAt:
          type: string
          format: date-time

    GeneratingResponse:
      type: object
      required: [status, retryAfter]
      properties:
        status:
          type: string
          enum: [generating]
        retryAfter:
          type: integer

    FeedbackDisagreementRequest:
      type: object
      required: [persona, reasonType]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        reasonType:
          $ref: '#/components/schemas/ReasonType'
        comment:
          type: string
          maxLength: 500
