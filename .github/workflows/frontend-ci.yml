name: Frontend CI
# frontend 변경 PR과 병합 후 develop에서 lint·build·단위 테스트·화면 E2E를 실행한다.
# secrets 를 쓰지 않는다. API 는 MSW 목이고 GitHub · 백엔드 · LLM 은 호출하지 않는다.
# 실제 앱·DB·Redis 를 쓰는 통합 E2E(test:integration)는 로컬 백엔드가 필요해 포함하지 않는다.

on:
  pull_request:
    branches: [develop, release]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR·병합·수동 검증이 서로 취소되지 않도록 이벤트와 ref를 구분한다.
  group: frontend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # lint · build(tsc 포함) · Vitest 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e:
    # 화면별 Playwright 스펙(MSW 목). 느리거나 불안정할 때 check 와 분리해 원인을 따로 본다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (MSW)
        run: npm test
