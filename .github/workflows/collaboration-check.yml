name: Collaboration draft checks
on:
  pull_request:
    paths:
      - 'spec/shared/contracts/**'
      - '.claude/scripts/**'
      - '.claude/settings.json'
      - '.github/workflows/collaboration-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .claude/scripts/requirements-checks.txt
      - run: python .claude/scripts/check_contracts.py
      - run: python -m unittest discover -s .claude/scripts/tests -v
